# g5sym_unrelaxed: graphene | 5-AGNR | graphene junction, LO model
# g5u_lo_kcorr_k3x3.npz (1 p_z-like LO per C, non-orthogonal: overlap.h5),
# written by toolchain/make_quatrex_inputs.py. Transport along a (x), periodic
# along b (y, 19.841 A) as examples/cp2k/graphene: kpoint_grid ky = 3 (multiples of 3 contain the
# graphene Dirac point, folded to ky = 1/3). Energies absolute, E_F = -4.0051 eV.
# The LO model is fitted at E_F; trust it within about +-1 eV of E_F.
simulation_dir = "."
input_dir = "../inputs"

formalism = "negf"

[device]
transport_direction = "a"
block_size = [64, 64, 64, 64, 76, 52, 20, 20, 68, 72, 64, 64, 64, 64]
kpoint_grid = [1, 3, 1]
num_orbitals_per_atom = { "C" = 1 }

    [[device.contacts]]
    name = "left"
    origin = [-20.762500, -0.5, 0.0]
    lattice_vectors = [[8.591400, 0, 0], [0, 19.840988, 0], [0, 0, 18.400000]]
    transport_direction = "a"
    fermi_level = -4.005118
    mid_gap_energy = -4.005118 # metallic leads: as the cp2k graphene example

    [[device.contacts]]
    name = "right"
    origin = [99.517100, -0.5, 0.0]
    lattice_vectors = [[-8.591400, 0, 0], [0, 19.840988, 0], [0, 0, 18.400000]]
    transport_direction = "a"
    fermi_level = -4.005118
    mid_gap_energy = -4.005118 # metallic leads: as the cp2k graphene example

[scba] # ===============================================================
max_iterations = 50
mixing_factor = 0.5

coulomb_screening = true
phonon = false

symmetric = true

[outputs] # Select which outputs to write.
electron_ldos = true
device_currents = true
meir_wingreen_currents = true
electron_density = false
hole_density = false

polarization_density = false
coulomb_screening_density = false

self_energy_density = false

save_profiling_results = true


[electron] # ===========================================================

# graphene leads have no gap: no band-edge tracking, no mid-gap energy
band_edge_tracking = false

# Energy grid.
energy_window_min = -5.029118
energy_window_max = -2.981618
energy_window_num = 4096

solver.algorithm = "rgf"
solver.max_batch_size = 1000

obc.algorithm = "spectral"
obc.nevp_solver = "full"

# Parameters for Beyn's method.
obc.num_ref_iterations = 2
obc.max_decay = 15
obc.min_decay = 1e-3
obc.r_o = 10
obc.r_i = 0.8
obc.m_0 = 31
obc.num_quad_points = 31

obc.memoizer.mode = "off"
obc.memoizer.num_ref_iterations = 3
obc.memoizer.relative_tol = 1e-2
obc.memoizer.absolute_tol = 1e-8
obc.residual_tolerance = 1e-4

[coulomb_screening] # ==================================================
interaction_cutoff = 8 # A, <= block width 8.59 A
epsilon_r = 8

num_connected_blocks = 1 # blocks differ in size (ribbon), so not 2; cutoff fits in one block

solver.algorithm = "rgf"
solver.max_batch_size = 1000

obc.algorithm = "spectral"
obc.nevp_solver = "full"

# Parameters for Beyn's method.
obc.num_ref_iterations = 2
obc.max_decay = 15
obc.min_decay = 1e-3
obc.r_o = 10
obc.r_i = 0.8
obc.m_0 = 32
obc.num_quad_points = 31
obc.residual_tolerance = 1e-4

obc.memoizer.mode = "off"
obc.memoizer.num_ref_iterations = 3
obc.memoizer.relative_tol = 1e-2
obc.memoizer.absolute_tol = 1e-8

lyapunov.algorithm = "spectral"
lyapunov.num_ref_iterations = 1

lyapunov.memoizer.mode = "off"
lyapunov.memoizer.num_ref_iterations = 3
lyapunov.memoizer.relative_tol = 2e-1
lyapunov.memoizer.absolute_tol = 1e-6
