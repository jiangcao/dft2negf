# g5sym_unrelaxed: graphene | 5-AGNR | graphene junction, LO model
# g5u_lo_kcorr_k3x3.npz (1 p_z-like LO per C, non-orthogonal: overlap.h5),
# written by toolchain/make_quatrex_inputs.py. Transport along a (x), periodic
# along b (y, 19.841 A) as examples/cp2k/graphene: kpoint_grid ky = 3 (multiples of 3 contain the
# graphene Dirac point, folded to ky = 1/3). Energies absolute, E_F = -4.0051 eV.
# The LO model is fitted at E_F; trust it within about +-1 eV of E_F.
simulation_dir = "."
input_dir = "../inputs"

formalism = "wf" # ballistic transmission (QTBM), after examples/cp2k/graphene/qtbm

[device]
transport_direction = "a"
kpoint_grid = [1, 3, 1]
num_orbitals_per_atom = { "C" = 1 }

    [[device.contacts]]
    name = "left"
    origin = [-20.762500, -0.5, 0.0]
    lattice_vectors = [[8.591400, 0, 0], [0, 19.840988, 0], [0, 0, 18.400000]]
    transport_direction = "a"
    fermi_level = -4.005118
    mid_gap_energy = -4.005118 # metallic leads: as the cp2k graphene example

    [[device.contacts]]
    name = "right"
    origin = [99.517100, -0.5, 0.0]
    lattice_vectors = [[-8.591400, 0, 0], [0, 19.840988, 0], [0, 0, 18.400000]]
    transport_direction = "a"
    fermi_level = -4.005118
    mid_gap_energy = -4.005118 # metallic leads: as the cp2k graphene example

[electron]
energy_window_min = -5.029118
energy_window_max = -2.981618
energy_window_num = 4096

    [electron.obc] # as examples/cp2k/graphene/qtbm
    algorithm = "spectral"
    num_ref_iterations = 10
    nevp_solver = "full"
    r_o = 1000
    r_i = 0.9
    m_0 = 100
    num_quad_points = 64
    min_decay = 1e-8
    max_decay = 10
